name: Actualiser le classement
on:
  push:
    branches: [main, validation-classement]
    paths-ignore: ['archives/**', 'README.md']
  workflow_dispatch:
  schedule:
    - cron: '2,17,32,47 * * * *'

permissions: {}
concurrency:
  group: classement-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      archive: ${{ steps.archive.outputs.path }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Tester les règles et les filtres
        run: |
          python3 -m unittest discover -s tests
          node --test tests/model.test.mjs
      - name: Extraire et valider les huit équipes
        run: python3 scripts/sync.py
      - name: Vérifier le navigateur sur ordinateur et téléphone
        if: github.event_name != 'schedule'
        env:
          CHROME_CHANNEL: chrome
        run: |
          npm ci --no-audit --no-fund
          npm run test:browser
      - name: Préparer le point de sauvegarde mensuel
        id: archive
        run: |
          month=$(date -u +%Y-%m)
          if [ ! -f "archives/$month.json" ]; then
            echo "path=archives/$month.json" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@v7.0.2
        if: steps.archive.outputs.path != ''
        with:
          name: sauvegarde
          path: site/data.json
          retention-days: 1
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: site
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5.0.1
        id: deployment
  archive:
    if: needs.build.outputs.archive != ''
    needs: [build, deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
      - uses: actions/download-artifact@v8.0.2
        with:
          name: sauvegarde
          path: ${{ runner.temp }}/sauvegarde
      - name: Archiver une extraction complète par mois
        env:
          ARCHIVE_PATH: ${{ needs.build.outputs.archive }}
        run: |
          if [ -f "$ARCHIVE_PATH" ]; then exit 0; fi
          mkdir -p archives
          cp "$RUNNER_TEMP/sauvegarde/data.json" "$ARCHIVE_PATH"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$ARCHIVE_PATH"
          git commit -m "Archiver le classement mensuel (${ARCHIVE_PATH:9:7})"
          git push origin HEAD:main
