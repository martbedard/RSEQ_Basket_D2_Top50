name: Vérifier les huit sources RSEQ
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  sources:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Interroger les huit API officielles
        run: |
          python3 - <<'PY'
          import json, urllib.request
          for team_id, name in json.load(open('config/teams.json')).items():
              url = 'https://s1.rseq.ca/api/TeamApi/GetTeamDiffusion/?teamId=' + team_id
              with urllib.request.urlopen(url, timeout=25) as response:
                  data = json.load(response)
              assert data['TeamId'] == team_id and data['TeamName'] == name
              assert '2026-2027' in data['StandingsName'] and data['LeagueBasketballStats']
              print(name, len(data['LeagueBasketballStats']))
          PY
